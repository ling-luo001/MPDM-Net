
#我完整读了一遍当前网络。它本质上是一个 MP-SENet 思路 + Mamba/ASSM 双塔 + VSS 交互融合 的语音增强模型：输入 noisy magnitude/phase，幅度塔偏 TF/频域建模，相位塔偏时间建模，中间和末端做 mag/phase 交互，最后输出 magnitude mask 和 phase rotation，再用 iSTFT 回到波形。这个方向是对的，和 MP-SENet、SEMamba、MambaIRv2/ASSM 的思路都能对上，但我觉得现在最有实验价值的优化点不是继续盲目堆深度，而是把“相位几何、交互稳定性、目标函数、泛化数据”这几件事做扎实。
#最值得做的优化建议
#把相位流从 raw phase 改成圆周几何建模
#现在模型输入和相位塔内部大量使用 noisy_pha 这个裸角度值，见 generator.py 的输入拼接逻辑大约在 forward 前段。裸相位在 -pi/pi 处不连续，卷积、归一化、Mamba/ASSM 都会把它当欧氏空间处理，这会伤害相位学习。2026 年的 GRE phase modeling 明确指出相位的圆周拓扑是关键，并通过 rotation equivariance 提升相位距离和泛化 PESQ。
#建议实验：
#输入从 [mag, pha] 改成 [mag, cos(pha), sin(pha)]，或直接 [real, imag, mag]。
#相位塔内部不再预测裸相位，而是全程预测单位复数旋转 delta_cos/delta_sin，你现在末端已经这么做了，可以把这个思想前移。
#加一个 global phase rotation augmentation：训练时随机给 noisy/clean phase 同时加常数旋转，看模型是否保持等变。
#相位 loss 增加 1 - cos(clean_pha - pred_pha)，比纯 anti-wrapping 更稳定。
env_setting:
  num_gpus: 1  # Number of GPUs. Now we don't support CPU mode.
  num_workers: 8  # Number of worker threads for data loading.
  seed: 1234  # Seed for random number generators to ensure reproducibility.
  stdout_interval: 200
  checkpoint_interval: 2000  # save model to ckpt every N steps
  validation_interval: 2000
  summary_interval: 200
  dist_cfg:
    dist_backend: nccl  # Distributed training backend, 'nccl' for NVIDIA GPUs.
    dist_url: tcp://localhost:29501  # URL for initializing distributed training.
    world_size: 1  # Total number of processes in the distributed training.

# Datapath Configuratoin
data_cfg:
  train_clean_json: data/mini_train_clean_list.json
  train_noisy_json: data/mini_train_noisy_list.json
  valid_clean_json: data/mini_val_clean_list.json
  valid_noisy_json: data/mini_val_noisy_list.json
  test_clean_json: data/test_clean.json
  test_noisy_json: data/test_noisy.json

# Training Configuration
# This section details parameters that directly influence the training process,
# including batch sizes, learning rates, and optimizer specifics.
training_cfg:
  training_epochs: 400 # Training epoch.
  batch_size: 2  # Training batch size.
  learning_rate: 0.0005  # Initial learning rate.
  adam_b1: 0.8  # Beta1 hyperparameter for the AdamW optimizer.
  adam_b2: 0.99  # Beta2 hyperparameter for the AdamW optimizer.
  lr_decay: 0.99  # Learning rate decay per epoch.
  segment_size: 30600  # Audio segment size used during training, dependent on sampling rate.
  loss:
    metric: 0.05
    magnitude: 0.9
    phase: 0.3
    complex: 0.1
    time: 0.2
    consistancy: 0.1
  use_PCS400: False  # Use PCS or not

# STFT Configuration
# Configuration for Short-Time Fourier Transform (STFT), crucial for audio processing models.
stft_cfg:
  sampling_rate: 16000  # Audio sampling rate in Hz.
  n_fft: 510  # FFT components for transforming audio signals.
  hop_size: 120  # Samples between successive frames.
  win_size: 510  # Window size used in FFT.

# Model Configuration
# Defines the architecture specifics of the model, including layer configurations and feature compression.
model_cfg:
  hid_feature: 16  # Channels in dense layers.
  dense_channel : 16
  compress_factor: 0.3  # Compression factor applied to extracted features.
  num_tfmamba: 2  # Number of Time-Frequency Mamba (TFMamba) blocks in the model.
  d_state: 16 # Dimensionality of the state vector in Mamba blocks.
  d_conv: 4  # Convolutional layer dimensionality within Mamba blocks.
  expand: 4  # Expansion factor for the layers within the Mamba blocks.
  norm_epsilon: 0.00001  # Numerical stability in normalization layers within the Mamba blocks.
  beta: 2.0  # Hyperparameter for the Learnable Sigmoid function.
  input_channel: 2 # Magnitude and Phase
  output_channel: 1  # Single Channel Speech Enhancement
  cross_pool_t: 2   # 时间下采样因子
  cross_pool_f: 2   # 频率下采样因子
  cross_sparse_window: 64   # 窗口大小，越小越快
  cross_global_window: 8    # 头/尾全局 token
  cross_sparsity: 0.9       # 稀疏率，越大越稀疏
  num_mid_pairs : 3



